name: Build and Release LavenderHook

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Version File
        id: get_version
        run: |
          $ver = (Get-Content Version).Trim()
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: Configure and build x64
        run: |
          cmake -S LavenderHook -B build-x64 -G "Visual Studio 17 2022" -A x64
          cmake --build build-x64 --config Release --parallel

      - name: Configure and build x86
        run: |
          cmake -S LavenderHook -B build-x86 -G "Visual Studio 17 2022" -A Win32
          cmake --build build-x86 --config Release --parallel

      - name: Stage artifacts
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build-x64/Release/LavenderHook.dll dist/LavenderHook-x64.dll
          Copy-Item build-x86/Release/LavenderHook.dll dist/LavenderHook-x86.dll
          Get-ChildItem dist

      - name: Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "LavenderHook ${{ steps.get_version.outputs.VERSION }}"
          body: "Automated build of the latest version (x86 + x64)."
          files: dist/*
          make_latest: "true"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
